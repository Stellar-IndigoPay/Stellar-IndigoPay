[workspace]
members = ["indigopay-contract", "escrow-contract", "oracle-contract", "attestation-contract"]
exclude = ["indigopay-contract/verification/kani"]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = true
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
