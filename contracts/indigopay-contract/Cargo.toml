[package]
name = "indigopay-contract"
version = "0.1.0"
edition = "2021"
description = "Stellar IndigoPay — Soroban smart contract for transparent climate donations"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.0"

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
proptest = "1.4"
serde_json = "1"
# Test-only: the cross-contract settlement tests (#439) deploy the real
# attestation contract alongside this one instead of a hand-rolled mock, so
# the two `Attestation` layouts are checked against each other.
attestation-contract = { path = "../attestation-contract" }

[features]
default = ["delegation", "recurring", "refund", "governance", "emergency", "upgrade", "usdc", "campaign", "donation", "impact", "impact_verification", "project_verification", "vesting"]
testutils = ["soroban-sdk/testutils"]
delegation = []
recurring = []
refund = []
governance = ["delegation"]
emergency = []
upgrade = []
usdc = []
campaign = []
donation = []
batch = []
zk = []
vesting = []
fees = []
impact = []
impact_verification = []
project_verification = []
escrow = []

