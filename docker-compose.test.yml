# docker-compose.test.yml
#
# CI test topology. `ci.yml` runs:
#
#     docker compose -f docker-compose.test.yml up \
#       --abort-on-container-exit --exit-code-from backend
#
# The backend container runs `npm test` (Jest) against the same backing
# services production uses — Postgres (pg-boss job queues, data) and Redis
# (caching, rate limiting) — so the queue/worker code paths (webhooks,
# summaries, matches, retention, idempotency cleanup, etc.) are actually
# exercised in CI rather than only unit-tested in isolation.
#
# Integration coverage splits two ways:
#   - `queueWorkers.integration.test.js` connects DIRECTLY to the `postgres`
#     service via DATABASE_URL and boots the real pg-boss workers
#     (`profileQueue`, `matchQueue`) to enqueue and consume jobs end-to-end.
#     It needs no Docker socket, so it runs inside this compose network.
#   - The testcontainers-based `*.integration.test.js` suites spin up their
#     own Postgres/Redis containers and therefore need a Docker socket; they
#     self-skip gracefully when it is unavailable (as inside this container).
#
# Keep the `postgres`/`redis` service definitions aligned with the production
# `docker-compose.yml` so a test can never pass against a service topology the
# real app does not have.

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_indigopay_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stellar_indigopay_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: indigopay-backend-test:ci
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stellar_indigopay_test
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      ALLOWED_ORIGINS: http://localhost:3000
      # The OpenAPI drift test requires repo-root scripts/validate-openapi.js,
      # which resolves js-yaml from the backend image's node_modules. NODE_PATH
      # lets that mounted module find /app/node_modules (see volumes below).
      NODE_PATH: /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The backend image only carries the ./backend build context, so the
    # OpenAPI drift test (backend/__tests__/scripts/openapi-drift.test.js)
    # cannot reach the repo-root scripts/ and docs/ trees otherwise. The
    # script resolves these relative to its own location (/scripts), so it
    # also expects docs/ and backend/src as siblings at the container root.
    volumes:
      - ./scripts:/scripts:ro
      - ./docs:/docs:ro
      - ./backend/src:/backend/src:ro
    command: sh -c "npm run db:migrate && npm test"
