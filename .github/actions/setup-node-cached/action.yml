name: 'Setup Node with Caching'
description: 'Sets up Node.js, uses actions/setup-node cache, and implements node_modules caching to skip npm ci when possible.'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory for npm commands'
    required: false
    default: '.'
  legacy-peer-deps:
    description: 'Use --legacy-peer-deps on npm ci'
    required: false
    default: 'false'
  ignore-scripts:
    description: 'Use --ignore-scripts on npm ci'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Cache node_modules
      uses: actions/cache@v4
      id: node-modules-cache
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        ARGS=""
        if [ "${{ inputs.legacy-peer-deps }}" = "true" ]; then
          ARGS="--legacy-peer-deps"
        fi
        if [ "${{ inputs.ignore-scripts }}" = "true" ]; then
          ARGS="$ARGS --ignore-scripts"
        fi
        npm ci $ARGS
