name: Frontend Build

on:
  push:
    branches: [main, develop]
  pull_request:

# Pin every devDependency additively here so floating semver never lands a
# different jest-axe on a system where we cannot pin via overrides.
# Comments by hand: nexus of jest+axe versions that play together.
# See frontend/scripts/axe-scan.README.md for context.

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  frontend-typecheck:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'
      - name: TypeScript type-check
        working-directory: frontend
        run: npm run type-check
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  frontend-tests-smoke:
    name: Frontend jest smoke (jest-axe resolves)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'
      - name: Verify jest-axe + axe-core resolve
        working-directory: frontend
        run: npm run test:smoke:install
      - name: Run Tabs + MonthlyGivingSetup jest smoke
        working-directory: frontend
        run: npm run test:smoke
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  frontend-tests:
    name: Frontend Unit + Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-tests-smoke]
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'
      - name: Run jest (unit + a11y)
        working-directory: frontend
        run: npm test -- --ci --colors=false
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  frontend-e2e:
    name: Frontend End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'
      - name: Install json-server for mock API
        run: npm install -g json-server
      - name: Start mock API server
        working-directory: frontend
        run: npx json-server --watch tests/e2e/fixtures/db.json --port 4000 &
        env:
          NODE_ENV: test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers (with dependencies)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # No separate install-deps step on cache hits: ubuntu-latest already
      # ships the Chromium system libraries, and `npx playwright install-deps`
      # invokes apt-get which intermittently deadlocks on the runner's dpkg
      # lock and hangs the job until the 15m timeout.
      - name: Build frontend for E2E
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Start Next.js server
        working-directory: frontend
        run: |
          E2E_TESTING=true \
          NEXT_PUBLIC_STELLAR_NETWORK=testnet \
          NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org \
          NEXT_PUBLIC_API_URL=http://localhost:4000 \
          npm run start &
          # Wait for the server to respond (up to 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3000; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start" >&2
          exit 1
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-lint, frontend-typecheck, frontend-tests, frontend-e2e]
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend (with bundle analysis)
        working-directory: frontend
        # ANALYZE=true produces the same .next output plus bundle-size
        # reports, so a second build is unnecessary.
        run: ANALYZE=true npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Check bundle size budget
        working-directory: frontend
        run: |
          echo "Checking first-load JS bundle sizes…"
          # Check route-specific page chunks only (exclude framework bundles like
          # _app, _document, and _error which contain shared runtime code).
          # Uses globstar (**) for recursive matching of nested route directories.
          MAX_SIZE=256000
          EXCEEDED=0
          shopt -s nullglob globstar
          for chunk in .next/static/chunks/pages/**/*.js; do
            NAME=$(basename "$chunk")
            # Skip framework/app bundles — not individual routes
            case "$NAME" in
              _app-*.js|_document-*.js|_error-*.js) continue ;;
            esac
            SIZE=$(stat -c%s "$chunk" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "::warning file=$chunk::Route chunk $NAME is $SIZE bytes (exceeds ${MAX_SIZE} byte budget)"
              EXCEEDED=$((EXCEEDED + 1))
            fi
          done
          if [ "$EXCEEDED" -gt 0 ]; then
            echo "::error title=Bundle size budget exceeded::${EXCEEDED} route chunk(s) exceed the 250KB first-load JS budget"
            exit 1
          fi
          echo "All route chunks within 250KB budget."
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache-e2e
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (with dependencies)
        if: steps.playwright-cache-e2e.outputs.cache-hit != 'true'
        working-directory: frontend
        # Every project in playwright.config.ts runs Chromium, so firefox and
        # webkit are never used. Installing their system deps (apt-get) is what
        # hung on ubuntu-latest and blew the 15m job timeout, so install only
        # the browser the suite actually launches.
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (if cached)
        if: steps.playwright-cache-e2e.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend for E2E
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Start Next.js server
        working-directory: frontend
        run: |
          E2E_TESTING=true \
          NEXT_PUBLIC_STELLAR_NETWORK=testnet \
          NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org \
          NEXT_PUBLIC_API_URL=http://localhost:4000 \
          npm run start &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3000; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start" >&2
          exit 1
      - name: Run Playwright tests
        working-directory: frontend
        # Visual regression snapshots are OS/font-render dependent — skip in CI,
        # run locally where the baseline images were generated.
        run: npm run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=html,list --grep-invert "Visual regression"
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: '600'

