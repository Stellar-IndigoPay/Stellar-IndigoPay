name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Nightly load test at 3 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start Timer
        working-directory: .
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: backend
      - run: npm run lint
      - run: npm run migration:lint
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.test
          load: true
          tags: indigopay-backend-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from backend
        working-directory: .
      - name: Budget Check
        if: always()
        uses: ./.github/actions/budget-check
        with:
          start-time: ${{ env.START_TIME }}
          max-seconds: "900"

  fuzz-test:
    name: API Fuzz Test (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: backend
      - run: npm ci
      - name: Run fast fuzz test
        env:
          FUZZ_ITERATIONS: 10
          NODE_ENV: test
        run: npm run test:fuzz || true  # Don't fail PR, but report results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-test-results
          path: backend/coverage/
          retention-days: 3

  mobile:
    name: Mobile (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      # --legacy-peer-deps tolerates the pre-existing Expo/React Navigation
      # peer conflicts (@react-navigation/native-stack@7 needs native@7 while
      # expo-router pins native@6; react-native-screens@4.25 needs
      # react-native>=0.82 against the pinned react-native@0.74.1).
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --ci --forceExit

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: latest
      - uses: azure/setup-kubectl@v3
        with:
          version: latest
      - run: helm lint helm/indigopay/
      - name: Validate Helm templates (syntax + YAML)
        run: helm template stellar-indigopay helm/indigopay/ > /dev/null
        # helm template validates Go template syntax and value rendering; no
        # cluster access is required, unlike kubectl apply --dry-run (which
        # needs a running K8s API server even with --validate=false).

  monitoring-and-gitops-lint:
    name: Alert Rules, Runbooks, and GitOps Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Ensure npm uses POSIX shell on Linux
        run: |
          npm config delete script-shell || true
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated runbook index is committed
        run: |
          node scripts/generate-runbook-index.js
          git diff --exit-code -- docs/runbooks/README.md
      - name: Validate Alert Rule Linkages and Runbooks
        run: node scripts/validate-alert-rules.js
      - name: Validate GitOps and Helm Consistency
        run: node scripts/validate-gitops.js

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scanning
        run: gitleaks detect --config .gitleaks.toml --source . --no-git --exit-code 1

  openapi-lint:
    name: OpenAPI Spec Validation (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Ensure npm uses POSIX shell on Linux
        run: |
          npm config delete script-shell || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate OpenAPI spec with Spectral (built-in OAS rules)
        run: npx @stoplight/spectral-cli@6.14.3 lint docs/api/openapi.yaml --ruleset .spectral.yaml

      - name: Validate spec conventions + detect OpenAPI route drift
        run: node scripts/validate-openapi.js

      # Workstream 4 — fast API fuzz self-test in PR CI. Guarantees the
      # schema-derived fuzz generator's invariants: every labelled "valid" case
      # satisfies its request schema, and every labelled "invalid" case truly
      # violates it. This is the in-process gate; the heavy live scan runs nightly
      # (fuzz-nightly.yml).
      - name: API fuzz self-test (100 iterations/endpoint)
        run: node scripts/validate-openapi.js --fuzz 100

  chaos:
    name: Backend Chaos Harness (worker crash-safety)
    runs-on: ubuntu-latest
    # Bounded at 10 minutes — all scenarios use testcontainers and
    # deterministic fault points rather than sleeps, so this is generous.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # CHAOS_TEST=1 activates the FaultInjector and the harness tests.
      # Never set this in any non-test job or in production.
      - name: Run chaos harness
        run: |
          CHAOS_TEST=1 npx jest \
            --testPathPatterns="test/chaos/workerChaos" \
            --forceExit \
            --ci \
            --verbose
        env:
          CHAOS_TEST: "1"
          NODE_ENV: test

  zap_scan:
    name: DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Default to a placeholder; override per-env in the GitHub UI or
          # via a `ZAP_TARGET` repository variable once staging is live.
          target: ${{ vars.ZAP_TARGET || 'https://example.com' }}
          cmd_options: "-J report.json"
          fail_action: false
        continue-on-error: true

      - name: Run Security Triage Script
        run: node scripts/triage-zap.js

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report.json
          retention-days: 14
          if-no-files-found: warn

  load-test-nightly:
    name: Load Test (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install k6
        run: |
          gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start backend services
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for backend to be ready
          timeout 60 bash -c 'until curl -fs http://localhost:4000/health > /dev/null; do sleep 2; done'

      - name: Run load test (100 VUs, 60s)
        run: |
          k6 run --out json=/tmp/load-test-results.json scripts/load-test.js
        env:
          BASE_URL: http://localhost:4000

      - name: Stop backend services
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload load test results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: /tmp/load-test-results.json
          retention-days: 30

      - name: Extract and save metrics summary
        if: success()
        run: |
          node scripts/extract-load-test-metrics.js /tmp/load-test-results.json > /tmp/metrics-summary.json
        continue-on-error: true

      - name: Upload metrics summary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: load-test-metrics-summary
          path: /tmp/metrics-summary.json
          retention-days: 30
