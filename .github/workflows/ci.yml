name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migration:lint
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: test
          load: true
          tags: indigopay-backend-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from backend
        working-directory: .

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: latest
      - uses: azure/setup-kubectl@v3
        with:
          version: latest
      - run: helm lint helm/indigopay/
      - name: Validate Helm templates (syntax + YAML)
        run: helm template stellar-indigopay helm/indigopay/ > /dev/null
        # helm template validates Go template syntax and value rendering; no
        # cluster access is required, unlike kubectl apply --dry-run (which
        # needs a running K8s API server even with --validate=false).

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
          curl --fail --show-error --silent --location \
            --retry 5 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${OS}_${ARCH}.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scanning
        run: gitleaks detect --config .gitleaks.toml --source . --no-git --exit-code 1

  openapi-lint:
    name: OpenAPI Spec Validation (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Ensure npm uses POSIX shell on Linux
        run: |
          npm config delete script-shell || true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate OpenAPI spec with Spectral (built-in OAS rules)
        run: npx @stoplight/spectral-cli@6.14.3 lint docs/api/openapi.yaml --ruleset .spectral.yaml

      - name: Validate project-specific conventions (429, descriptions, summaries)
        run: node scripts/validate-openapi.js

  zap_scan:
    name: DAST Security Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Default to a placeholder; override per-env in the GitHub UI or
          # via a `ZAP_TARGET` repository variable once staging is live.
          target: ${{ vars.ZAP_TARGET || 'https://example.com' }}
          cmd_options: "-J report.json"
          fail_action: false
        continue-on-error: true

      - name: Run Security Triage Script
        run: node scripts/triage-zap.js

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: |
            report_html.html
            report.json
          retention-days: 14
          if-no-files-found: warn

  performance_smoke:
    name: Performance Smoke Test (k6)
    runs-on: ubuntu-latest
    # Informational only — failures are visible in CI but never block merges.
    continue-on-error: true
    # Only run after the backend job so the service under test has been built
    # and validated first.
    needs: [backend]
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      # ── 1. Spin up Postgres + Redis ──────────────────────────────────────
      - name: Start Postgres
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=indigopay \
            -p 5432:5432 \
            postgres:16-alpine
          # Wait until Postgres accepts connections
          for i in $(seq 1 20); do
            docker exec pg pg_isready -U postgres -d indigopay \
              > /dev/null 2>&1 && echo "Postgres ready." && break
            echo "  pg not ready yet ($i/20)…"; sleep 2
          done

      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 10); do
            docker exec redis redis-cli ping 2>/dev/null | grep -q PONG \
              && echo "Redis ready." && break
            echo "  redis not ready yet ($i/10)…"; sleep 1
          done

      # ── 2. Build the HTTP server image (runner stage, not test stage) ────
      - name: Build backend server image
        run: |
          docker build \
            --target runner \
            --tag indigopay-backend-server:ci \
            ./backend

      # ── 3. Start the backend HTTP server ────────────────────────────────
      - name: Start backend HTTP server
        run: |
          docker run -d --name backend \
            --network host \
            -e PORT=4000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/indigopay \
            -e REDIS_URL=redis://localhost:6379 \
            -e STELLAR_NETWORK=testnet \
            -e HORIZON_URL=https://horizon-testnet.stellar.org \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e JWT_SECRET=ci-smoke-jwt-secret \
            -e COOKIE_SECRET=ci-smoke-cookie-secret \
            -e ANTHROPIC_API_KEY=dummy \
            -e SOROBAN_CONTRACT_ID=dummy \
            indigopay-backend-server:ci

      # ── 4. Wait for /api/health ──────────────────────────────────────────
      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend health endpoint…"
          for i in $(seq 1 40); do
            if curl --silent --fail http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Backend is healthy (attempt $i)."
              exit 0
            fi
            echo "  attempt $i/40 — retrying in 3s"
            sleep 3
          done
          echo "::error::Backend did not become healthy after 40 attempts."
          docker logs backend --tail 50
          exit 1

      # ── 5. Install k6 ────────────────────────────────────────────────────
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      # ── 6. Run the smoke test ─────────────────────────────────────────────
      - name: Run CI performance smoke test
        run: k6 run scripts/load-test-ci.js
        env:
          BASE_URL: http://localhost:4000

      # ── 7. Cleanup ────────────────────────────────────────────────────────
      - name: Tear down containers
        if: always()
        run: |
          docker rm -f backend pg redis 2>/dev/null || true
