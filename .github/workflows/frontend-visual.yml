name: Frontend Visual Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  visual:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: frontend
          legacy-peer-deps: 'true'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache-visual
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-visual-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-visual-

      - name: Install Playwright browsers (with dependencies)
        if: steps.playwright-cache-visual.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (if cached)
        if: steps.playwright-cache-visual.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Build frontend for E2E
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Start Next.js server
        working-directory: frontend
        run: |
          E2E_TESTING=true \
          NEXT_PUBLIC_STELLAR_NETWORK=testnet \
          NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org \
          NEXT_PUBLIC_API_URL=http://localhost:4000 \
          npm run start &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3000; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start" >&2
          exit 1

      - name: Run Playwright Visual tests
        working-directory: frontend
        run: npx playwright test e2e/visual/visual.spec.ts --reporter=html,list
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          retention-days: 14
