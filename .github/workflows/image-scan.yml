# .github/workflows/image-scan.yml
#
# Trivy image scan for backend and frontend Docker images. Runs after
# the CI build (or directly on main pushes). Reports CRITICAL and HIGH
# vulnerabilities but does not fail the build on unfixable upstream
# CVEs, so security findings are visible without blocking delivery.

name: Image Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service: [backend, frontend]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKERHUB_USERNAME != '' && 'docker.io' || 'ghcr.io' }}
          username: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_USERNAME || github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          tags: stellar-indigopay-${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellar-indigopay-${{ matrix.service }}:scan
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: ".trivyignore"

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Run raw Trivy scan for staleness check
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stellar-indigopay-${{ matrix.service }}:scan
          format: "json"
          output: "trivy-raw-${{ matrix.service }}.json"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload raw Trivy scan report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-raw-${{ matrix.service }}
          path: trivy-raw-${{ matrix.service }}.json
          retention-days: 1

  trivy-staleness:
    name: Trivy Staleness Check
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all raw Trivy reports
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: trivy-raw-*
          merge-multiple: true

      - name: Check for stale suppressions
        run: node scripts/check-stale-trivy.js
