# .github/workflows/restore-drill.yml
#
# Monthly restore drill. Spins up an ephemeral Postgres pod, pulls
# the latest backup from S3, restores it, and asserts the row
# counts on the canonical tables match what production has.
#
# Schedule: 1st of every month at 03:00 UTC.
# Manual dispatch: workflow_dispatch.

name: Monthly Restore Drill

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  ci-pass:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  restore-drill:
    if: github.event_name != 'push'
    name: Restore latest backup and assert row counts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install postgres client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start ephemeral postgres
        run: |
          docker run -d --name drill-db \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=stellar_indigopay_drill \
            -p 5433:5432 \
            postgres:16-alpine
          sleep 10
          for i in {1..30}; do
            pg_isready -h localhost -p 5433 && break
            sleep 2
          done

      - name: Download latest backup
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          # Filter the listing to the backup artifact itself (.sql.gz). The
          # .sha256 / .rowchecksums.json sidecars must NOT be eligible to
          # become LATEST or gunzip below would fail before the restore starts.
          LATEST=$(aws s3 ls "s3://${S3_BUCKET}/backups/" --recursive \
            | awk '$4 ~ /\.sql\.gz$/ { print $4 }' \
            | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No .sql.gz backups found in s3://${S3_BUCKET}/backups/"
            exit 1
          fi
          echo "Restoring from $LATEST"
          aws s3 cp "s3://${S3_BUCKET}/${LATEST}" /tmp/backup.sql.gz
          # Fetch the integrity sidecars written by scripts/backup-db.sh (WS4 / #1100).
          # A missing sidecar fails the drill — a hardened backup is REQUIRED to
          # ship .sha256 and .rowchecksums.json so integrity is verifiable.
          if ! aws s3 cp "s3://${S3_BUCKET}/${LATEST}.sha256" /tmp/backup.sql.gz.sha256 --quiet 2>/dev/null; then
            echo "::error::Selected backup ${LATEST} has no .sha256 sidecar — refusing to restore an unverifiable artifact."
            exit 1
          fi
          if ! aws s3 cp "s3://${S3_BUCKET}/${LATEST}.rowchecksums.json" /tmp/backup.rowchecksums.json --quiet 2>/dev/null; then
            echo "::error::Selected backup ${LATEST} has no .rowchecksums.json sidecar — refusing to restore an unverifiable artifact."
            exit 1
          fi
          gunzip -kf /tmp/backup.sql.gz

      - name: Verify backup checksum
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          # The download step requires the .sha256 sidecar, so it is guaranteed
          # to be present here. Compare it against the real artifact hash.
          EXPECTED=$(awk '{print $1}' /tmp/backup.sql.gz.sha256)
          ACTUAL=$(sha256sum /tmp/backup.sql.gz | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Backup SHA-256 mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "✅ Backup SHA-256 verified: $ACTUAL"

      - name: Restore backup
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d stellar_indigopay_drill \
            -f /tmp/backup.sql

      - name: Verify restore integrity (row checksums + DB objects)
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # The download step requires the .rowchecksums.json sidecar, so it is
          # guaranteed to be present here.
          if [ ! -f /tmp/backup.rowchecksums.json ]; then
            echo "::error::No .rowchecksums.json sidecar found — cannot run row-level integrity checks."
            exit 1
          fi
          bash scripts/verify-restore-checksum.sh \
            --backup /tmp/backup.sql.gz \
            --row-checksums /tmp/backup.rowchecksums.json \
            --db-url "postgres://postgres:postgres@localhost:5433/stellar_indigopay_drill"

      - name: Assert row counts
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          TABLES=("projects" "donations" "profiles" "webhook_deliveries")
          for T in "${TABLES[@]}"; do
            COUNT=$(psql -h localhost -p 5433 -U postgres -d stellar_indigopay_drill \
              -tAc "SELECT count(*) FROM ${T};")
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::Table ${T} has 0 rows after restore — backup is incomplete"
              exit 1
            fi
            echo "  ${T}: ${COUNT} rows ✅"
          done

      - name: Tear down ephemeral postgres
        if: always()
        run: |
          docker rm -f drill-db || true

      - name: Notify on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            core.notice('✅ Monthly restore drill passed. Backup integrity verified.');

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Monthly Restore Drill Failed';
            const body = `The monthly restore drill failed on ${new Date().toISOString()}.
            Investigate immediately — this means the production backup may be unrecoverable.
            Run: ${context.serverUrl}/${context.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['bug', 'devops', 'backup', 'oncall'],
            });
