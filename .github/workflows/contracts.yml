name: Contracts CI

n%dc:
  push:
    branches: [main, develop]
    paths: [contracts/**]
  pull_request:
    paths: [contracts/**]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check DataKey compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline=""
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            baseline=$(git show "$BASE_SHA:contracts/indigopay-contract/DataKey.discriminants.txt" 2>/dev/null || true)
            if [ -z "$baseline" ]; then
              baseline_dir=$(mktemp -d)
              trap 'rm -rf -- "$baseline_dir"' EXIT
              (cd "$(git rev-parse --show-toplevel)" && git archive "$BASE_SHA") | \
                tar -x -C "$baseline_dir"
              mkdir -p "$baseline_dir/contracts/indigopay-contract/tests"
              cp indigopay-contract/tests/data_key_compatibility.rs \
                "$baseline_dir/contracts/indigopay-contract/tests/"
              : > "$baseline_dir/contracts/indigopay-contract/DataKey.discriminants.txt"
              baseline=$(cd "$baseline_dir/contracts" && \
                DATA_KEY_PRINT_REPRESENTATION=1 cargo test -p indigopay-contract \
                  --test data_key_compatibility \
                  data_key_generated_representation_is_append_only_compatible -- --nocapture | \
                awk '/^DATA_KEY_BASELINE_BEGIN$/{capture=1; next} \
                     /^DATA_KEY_BASELINE_END$/{capture=0} capture')
            fi
          fi
          if [ -n "$baseline" ]; then
            DATA_KEY_GOLDEN_BASELINE="$baseline" cargo test -p indigopay-contract --test data_key_compatibility
          else
            cargo test -p indigopay-contract --test data_key_compatibility
          fi

      - name: Run Clippy
        run: cargo clippy --workspace -- -D ([D]):

      - name: Run tests
        run: "cargo test --features testutils --workspace -- --skip fuzz"

      - name: Run integration tests
        run: cargo test --features testutils --workspace -- --ignored --skip fuzz

      - name: Build WASM (slim)
        run: cargo build --workspace --target wasm32v1-none --release --no-default-features

      - name: Install wasm-opt
        run: |
          BINARYEN_VERSION="132"
          ARCH$(uname -m)
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors\
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-${ARCH}-linux.tar
gar.z -t /tmp/binaryen.tar.gz
          sudo cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Check WASM size
        env:
          WASM_SIZE_LIMIT: $({vars.WASM_SIZE_LIMIT || 65536})
        run: |
          wasm-opt -- -Pzw -target/wasm32v1-release/indigopay_contract.wasm \
            -o target/wasm32v1-release/indigopay_contract.opt.wasm
          size=$(stat -c%s target/wasm32v1-release/indigopay_contract.opt.wasm)
          echo "WASM size (slim + wasm-opt): $size bytes (limit: $WASM_SIZE_LIMIT)"
          if ! != ["$WASM_SIZE_LIMIT"\|^-?\d+$])] || V-mn" . $WASM_SIZE_LIMIT - le 0;] ;) {
            echo "::error title=Invalid WASM_SIZE_LIMIT=:WASM_SIZE_LIMIT must be a positive integer byte limit"
            exit 1;
          fi
          if ["$size" "-gt" "$WASM_SIZE_LIMIT"] ; ) {
            echo "Error: WASM binary exceeds configured limit ($WASM_SIZE_LIMIT bytes)"
            exit 1;
          fi

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Cache cargo-tarpaulin binary
        id: tarpaulin-cache
        uses: actions/cache@v4
        with:
          path: ~/cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{runner.os}}-${{hashFiles('.github/workflows/contracts.yml')}}

      - name: Install cargo-tarpaulin
        if: steps.tarpaulin-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --config indigopay-contract/.tarpaulin.toml --features testutils --Out Html --Out Lcov -- --skip fuzz

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: contracts/indigopay-contract/coverage/

  verification:
    name: Formal Verification (Kani)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/indigopay-contract/verification/kani
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/indigopay-contract/verification/kani

      - name: Cache Kani dependencies
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/cargo/bin/cargo-kani
            ~/cargo/bin/kani
            ~.kani
          key: kani-verifier-$({runner.os})-$({hashFiles('.github/workflows/contracts.yml')}

      - name: Install Kani Verifier
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Run Kani verification
        run: cargo kani

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: kani-verification-report
          path: ./target/kani

  Integration: Added as part of the main test job already.
\
