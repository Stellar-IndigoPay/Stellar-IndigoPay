# .github/workflows/networkpolicy-lint.yml
#
# Enforces the default-deny egress posture for the NetworkPolicies that ship
# in the default `k8s/kustomization.yaml`. The validation script fails the
# build if any applied policy regresses to an un-scoped egress rule (a rule
# with no `to` selector) or an all-hosts `ipBlock` (`0.0.0.0/0`, `::/0`).
#
# Opt-in policies under `k8s/opt-in/` are deliberately excluded (they are not
# referenced by the kustomization) because they document broader, explicit
# exceptions such as webhook delivery to arbitrary project URLs.

name: NetworkPolicy Lint

on:
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/validate-networkpolicies.js"
      - ".github/workflows/networkpolicy-lint.yml"
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "scripts/validate-networkpolicies.js"
      - ".github/workflows/networkpolicy-lint.yml"

jobs:
  lint-networkpolicies:
    name: Validate NetworkPolicies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate NetworkPolicy manifests
        run: node scripts/validate-networkpolicies.js

      - name: Validate Worker PDBs
        run: node scripts/validate-worker-pdbs.js
