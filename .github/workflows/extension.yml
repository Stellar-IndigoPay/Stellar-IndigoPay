name: Extension CI

on:
  push:
    tags:
      - "v*"
    paths:
      - "extension/**"
    branches: [main, develop]
  pull_request:
    paths:
      - "extension/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Start Timer
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            # For branch pushes, derive version from manifest.json
            VERSION=$(node -e "console.log(require('./manifest.json').version)")
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"
          export VERSION
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest_path = Path("manifest.json")
          data = json.loads(manifest_path.read_text())
          data["version"] = os.environ["VERSION"]
          manifest_path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - uses: ./.github/actions/setup-node-cached
        with:
          node-version: "22"
          working-directory: extension

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Scan for plaintext secrets in storage (#656)
        run: node scripts/scan-storage-secrets.js

      - run: npm run build

      - name: Verify build output
        run: test -f dist/content-script.js

      - name: Package extension ZIP
        run: npm run package

      - name: Verify packaged extension
        run: test -f greenpay-extension.zip && zipinfo -1 greenpay-extension.zip | grep -E '^(manifest\.json|popup\.html|popup\.css|settings\.html|dist/|inject/)' >/dev/null

      - name: Verify reproducible package
        run: |
          sha256sum greenpay-extension.zip | awk '{print $1}' > /tmp/greenpay-extension-hash-1
          rm -f greenpay-extension.zip
          npm run package
          sha256sum greenpay-extension.zip | awk '{print $1}' > /tmp/greenpay-extension-hash-2
          diff -u /tmp/greenpay-extension-hash-1 /tmp/greenpay-extension-hash-2

      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
          retention-days: 7

      - name: Upload extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenpay-extension-${{ steps.version.outputs.version }}
          path: extension/greenpay-extension.zip
          if-no-files-found: error
          retention-days: 30
