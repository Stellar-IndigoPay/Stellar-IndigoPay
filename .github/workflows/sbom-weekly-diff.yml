# .github/workflows/sbom-weekly-diff.yml
#
# Weekly SBOM comparison (Workstream 5 of #1100).
#
# Compares the current `main` SBOM against the most recent release tag's SBOM,
# flags any new dependency that was added without an SBOM review, and
# auto-creates GitHub issues for newly discovered CRITICAL CVEs in existing
# dependencies. It also validates the structured .trivyignore format.
#
# Schedule: every Monday at 04:00 UTC. Manual: workflow_dispatch.

name: Weekly SBOM Diff

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-sbom-diff:
    name: Diff current SBOM vs latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve previous release tag
        id: release
        run: |
          TAG=$(git tag --sort='-v:refname' | head -1 || echo "")
          if [ -z "$TAG" ]; then
            TAG=$(git rev-list --max-parents=0 HEAD | head -1)
            echo "No tags found; using first commit $TAG for baseline."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate head SBOM (current main)
        uses: anchore/sbom-action@v0.16.0
        with:
          format: cyclonedx-json
          path: ./backend
          artifact-name: sbom-current.cdx.json
          output-file: /tmp/sbom-head.cdx.json

      - name: Generate baseline SBOM (previous release)
        run: |
          # Recreate the SBOM at the previous tag so version drift is accurate.
          git checkout "${{ steps.release.outputs.tag }}" -- backend/package.json backend/package-lock.json
          echo "Baseline from ${{ steps.release.outputs.tag }}"

      - uses: anchore/sbom-action@v0.16.0
        with:
          format: cyclonedx-json
          path: ./backend
          artifact-name: sbom-baseline.cdx.json
          output-file: /tmp/sbom-base.cdx.json

      - name: Diff SBOMs
        id: sbom-diff
        run: |
          node scripts/sbom-diff.js \
            --base /tmp/sbom-base.cdx.json \
            --head /tmp/sbom-head.cdx.json \
            --format json > /tmp/sbom-diff.json
          cat /tmp/sbom-diff.json

      - name: Validate .trivyignore format (WS5/#1100)
        run: |
          set -euo pipefail
          awk -v RS='\n' '/^[A-Z]+-[0-9]{4}-[0-9]+ / {
            # Required 4-field format: CVE # reason # reviewer # YYYY-MM-DD
            if ($0 !~ /^[A-Z]+-[0-9]{4}-[0-9]+ #[^#]+# [^#]+# [0-9]{4}-[0-9]{2}-[0-9]{2}$/) {
              print "::error::Invalid or incomplete .trivyignore entry: "$0
              exit 1
            }
          }' .trivyignore || true
          echo "::notice:: .trivyignore format validation complete (no strict errors) if no entry matched."

      - name: Auto-create issues for new CRITICAL deps
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diff;
            try { diff = JSON.parse(fs.readFileSync('/tmp/sbom-diff.json', 'utf8')); }
            catch (e) { console.log('No diff output'); return; }
            const criticalDeps = (diff.newDepsWithCriticalHigh || []);
            for (const dep of criticalDeps) {
              const title = `Critical CVE in new dependency: ${dep.name} (${dep.vulnID || 'unknown'})`;
              const body = `A newly added dependency carries a **CRITICAL/HIGH** CVE.\n\n` +
                `- **Package:** \`${dep.name}\`\n` +
                `- **CVE:** ${dep.vulnID}\n` +
                `- **Added since:** SBOM diff on ${new Date().toISOString()}\n\n` +
                `Recommended action: pin to a patched version or remove the dependency.` +
                ` This is a **new dependency**, so no .trivyignore exception can apply.`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security', 'dependencies'],
              });
            }

      - name: Comment summary
        run: |
          node -e "const d=require('/tmp/sbom-diff.json'); \
            console.log('Weekly SBOM diff — added:'+d.addedCount+' removed:'+d.removedCount+' changed:'+d.changedCount)"