# monitoring/prometheus.yml
# Prometheus scrape configuration for the Stellar IndigoPay backend.
#
# Mount this file at /etc/prometheus/prometheus.yml on the Prometheus
# container. It expects the backend to be reachable at `backend-svc:4000`
# (the Kubernetes service name).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: stellar-indigopay

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/alert-rules-routing.yml
  - /etc/prometheus/recording-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: stellar-indigopay-backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: http
    authorization:
      type: Bearer
      credentials: ${PROMETHEUS_BEARER_TOKEN}
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: backend
      - source_labels: [__meta_kubernetes_pod_label_pod_template_hash]
        target_label: pod_template_hash
      - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
        target_label: rollouts_pod_template_hash
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:4000
      - target_label: service
        replacement: stellar-indigopay-api
      - target_label: env
        replacement: production

  # ── PostgreSQL exporter (primary) ──────────────────────────────────
  # Requires postgres_exporter sidecar or standalone deployment.
  # Install: helm install postgres-exporter prometheus-community/prometheus-postgres-exporter
  - job_name: postgres-exporter-primary
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["postgres-exporter-primary:9187"]
        labels:
          service: postgres-primary
          env: production

  # ── PostgreSQL exporter (standby) ──────────────────────────────────
  - job_name: postgres-exporter-standby
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ["postgres-exporter-standby:9187"]
        labels:
          service: postgres-standby
          env: production

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Synthetic monitor (issue #1144 Part A) ─────────────────────────
  # Scrapes the HTTP /metrics endpoint exposed by scripts/synthetic-monitor.js
  # running as a Kubernetes CronJob sidecar or standalone pod.
  - job_name: synthetic-monitor
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ["synthetic-monitor-svc:9091"]
        labels:
          service: stellar-indigopay-synthetic
          env: production

  # ── Business metrics exporter (issue #1144 Part B) ─────────────────
  # Scrapes the HTTP /metrics endpoint exposed by scripts/business-metrics-exporter.js.
  - job_name: business-metrics-exporter
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets: ["business-metrics-exporter-svc:9092"]
        labels:
          service: stellar-indigopay-business-metrics
          env: production
