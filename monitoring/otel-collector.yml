receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # API head sampling is performed by OTEL_API_SAMPLE_RATIO in the SDK.
  # Tail sampling retains failures/slow worker traces and samples the remainder.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow-workers
        type: latency
        latency: { threshold_ms: 2000 }
      - name: bounded-baseline
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
  attributes/privacy:
    actions:
      - { key: http.request.body, action: delete }
      - { key: http.response.body, action: delete }
      - { key: db.statement, action: delete }
      - { key: messaging.message.body, action: delete }
      - { key: user.email, action: delete }
      - { key: enduser.id, action: delete }

exporters:
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: ${env:OTEL_EXPORTER_INSECURE}

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, tail_sampling, batch]
      exporters: [otlp/tempo]
