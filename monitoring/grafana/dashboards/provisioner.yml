# monitoring/grafana/dashboards/provisioner.yml
# Grafana dashboard provisioning configuration.
# Tells Grafana to load all JSON files from /var/lib/grafana/dashboards.
# Mount this file at /etc/grafana/provisioning/dashboards/provisioner.yml.

apiVersion: 1

providers:
  - name: "IndigoPay Dashboards"
    orgId: 1
    folder: "IndigoPay"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
