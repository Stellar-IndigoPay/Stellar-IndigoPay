apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: stellar-indigopay
  labels:
    app: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  strategy:
    canary:
      canaryService: backend-svc
      stableService: backend-svc
      steps:
      - setWeight: 20
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 5m
      - setWeight: 100
      analysis:
        templates:
        - templateName: canary-vs-stable
        startingStep: 1
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: stellar-indigopay
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 35
      containers:
      - name: backend
        image: stellar-indigopay/backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: stellar-indigopay-config
        - secretRef:
            name: stellar-indigopay-secrets
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 1
          periodSeconds: 1
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
