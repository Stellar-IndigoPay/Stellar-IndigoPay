# k8s/synthetic-monitor.yaml
#
# In-cluster synthetic donation monitor (Workstream 7 of #1100).
#
# Optional CronJob that runs the end-to-end synthetic donation every 5 minutes,
# mirroring .github/workflows/synthetic-monitor.yml for environments WITHOUT
# GitHub Actions access. It reads the synthetic sender secret from
# k8s/secret.yaml / external-secret.yaml and PUSHES Prometheus metrics to the
# durable in-cluster Prometheus Pushgateway before the pod exits (see
# PROMETHEUS_PUSH_URL in scripts/synthetic-monitor.js). Prometheus then scrapes
# the Pushgateway, so metric delivery survives the ephemeral CronJob pod.
#
# PREREQUISITE: a Prometheus Pushgateway must be deployed and reachable at
# http://prometheus-pushgateway.monitoring.svc:9091 (adjust PROMETHEUS_PUSH_URL
# below to match your deployment).
#
# Deploy with:
#   kubectl apply -f k8s/synthetic-monitor.yaml -n stellar-indigopay
#
# Set SYNTHETIC_REPO_REF (default: main) or a pinned release tag for strict
# change control.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthetic-monitor
  namespace: stellar-indigopay
  labels:
    app: synthetic-monitor
    component: observability
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: synthetic-monitor
        spec:
          restartPolicy: Never
          containers:
            - name: synthetic-monitor
              image: node:20-alpine
              command: ["sh", "-ec"]
              args:
                - |
                  : "${SYNTHETIC_SENDER_SECRET:?SYNTHETIC_SENDER_SECRET must be mounted}"
                  cd /tmp
                  git clone --depth 1 --branch "$SYNTHETIC_REPO_REF" \
                    https://github.com/Stellar-IndigoPay/Stellar-IndigoPay.git repo >/dev/null 2>&1
                  cd repo/scripts
                  npm install @stellar/stellar-sdk@12 prom-client@15 --no-audit --no-fund >/dev/null 2>&1
                  # Run once and PUSH metrics to the durable Prometheus Pushgateway
                  # (PROMETHEUS_PUSH_URL). A CronJob's pod is ephemeral and the job
                  # volume disappears on exit, so the metrics must reach a persisted
                  # endpoint for Prometheus to scrape (see synthetic-monitor.js).
                  node synthetic-monitor.js --run-once
                  exit_code=$?
                  echo "synthetic monitor exit_code=$exit_code"
                  exit $exit_code
              env:
                - name: SYNTHETIC_SENDER_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: stellar-indigopay-secrets
                      key: SYNTHETIC_SENDER_SECRET
                      optional: false
                - name: SYNTHETIC_PROJECT_ID
                  valueFrom:
                    secretKeyRef:
                      name: stellar-indigopay-secrets
                      key: SYNTHETIC_PROJECT_ID
                      optional: true
                - name: SYNTHETIC_DESTINATION
                  valueFrom:
                    secretKeyRef:
                      name: stellar-indigopay-secrets
                      key: SYNTHETIC_DESTINATION
                      optional: true
                - name: SYNTHETIC_REPO_REF
                  value: "main"
                - name: STELLAR_NETWORK
                  value: "testnet"
                - name: HORIZON_URL
                  value: "https://horizon-testnet.stellar.org"
                - name: SOROBAN_RPC_URL
                  value: "https://soroban-testnet.stellar.org"
                - name: BACKEND_URL
                  value: "http://backend-svc:4000"
                # Durable endpoint arrayed by the in-cluster Prometheus Pushgateway.
                # Without this the CronJob's metrics would be lost when the pod exits.
                - name: PROMETHEUS_PUSH_URL
                  value: "http://prometheus-pushgateway.monitoring.svc:9091"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"