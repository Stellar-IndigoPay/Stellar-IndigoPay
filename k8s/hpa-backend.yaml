# k8s/hpa-backend.yaml
#
# HorizontalPodAutoscaler for the backend Deployment. Replaces the
# static `replicas: 2` in backend.yaml — the controller will scale up
# to the max replicas on queue backlog/indexer lag or CPU/memory pressure,
# and back down to the min replicas after a stabilization window.
#
# Requires k8s-prometheus-adapter (or metrics-server for resource fallbacks).
# Prometheus adapter rules map `queue_depth` and `indexer_lag_seconds` to the
# Custom/External Metrics API.
# Install Prometheus adapter via Helm:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install prometheus-adapter prometheus-community/prometheus-adapter \
#     --set rules.existing=prometheus-adapter-config
#
# Primary scaling triggers:
#   - queue_depth (pg-boss queue backlog per replica > 20)
#   - indexer_lag_seconds (cluster-wide indexer lag > 10s)
# Fallback triggers:
#   - CPU utilization (70%)
#   - Memory utilization (80%)

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: stellar-indigopay
  labels:
    app: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: External
      external:
        metric:
          name: queue_depth
        target:
          type: AverageValue
          averageValue: "20"
    - type: External
      external:
        metric:
          name: indexer_lag_seconds
        target:
          type: Value
          value: "10"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
