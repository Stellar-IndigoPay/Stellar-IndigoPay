apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-guardian
  namespace: stellar-indigopay
  labels:
    app: worker-guardian
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-guardian
  template:
    metadata:
      labels:
        app: worker-guardian
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: worker
          image: stellar-indigopay/backend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_ROLE
              value: guardian
          envFrom:
            - configMapRef:
                name: stellar-indigopay-config
            - secretRef:
                name: stellar-indigopay-secrets
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 1
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 15']
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-guardian
  namespace: stellar-indigopay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: worker-guardian
